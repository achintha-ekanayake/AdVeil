name: Release

on:
  release:
    types: [published]

jobs:
  build-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate DNR rules
        run: npm run build

      - name: Stage runtime files
        run: |
          mkdir -p stage/rules/generated
          cp manifest.json LICENSE stage/
          cp -r background content-scripts popup icons stage/
          cp rules/generated/dnr-rules.json stage/rules/generated/

      - id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Chrome package
        run: (cd stage && zip -r -X "../adveil-${{ steps.version.outputs.value }}-chrome.zip" . -x '.*')

      - name: web-ext lint
        run: npx --yes web-ext lint --source-dir=stage

      - name: Build Firefox package
        run: |
          npx --yes web-ext build --source-dir=stage --artifacts-dir=artifacts --overwrite-dest
          mv "artifacts/adveil-${{ steps.version.outputs.value }}.zip" "adveil-${{ steps.version.outputs.value }}-firefox.zip"

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            adveil-${{ steps.version.outputs.value }}-chrome.zip
            adveil-${{ steps.version.outputs.value }}-firefox.zip

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli --source "adveil-${{ steps.version.outputs.value }}-chrome.zip"

  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync CONTRIBUTORS.md against GitHub's contributor list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Logins currently listed in the file committed at the last release
          # (empty if the file doesn't exist yet, e.g. the very first run).
          if [ -f CONTRIBUTORS.md ]; then
            grep -oP '(?<=\(https://github.com/)[^)]+' CONTRIBUTORS.md | sort -u > old-logins.txt
          else
            : > old-logins.txt
          fi

          # GitHub's contributor list is the source of truth. Regenerating
          # the whole file from it (rather than patching the old one) means
          # a hand-edited or tampered-with file gets corrected automatically,
          # not just appended to.
          gh api "repos/${{ github.repository }}/contributors" --paginate \
            | jq -r '.[] | select(.type != "Bot") | .login' | sort -u > new-logins.txt

          added=$(comm -13 old-logins.txt new-logins.txt)

          {
            echo "# Contributors"
            echo
            echo "Generated automatically from GitHub's contributor list on each release. Do not edit by hand."
            echo
            while read -r login; do
              [ -n "$login" ] && echo "- [$login](https://github.com/$login)"
            done < new-logins.txt
          } > CONTRIBUTORS.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md

          if git diff --cached --quiet; then
            echo "CONTRIBUTORS.md already up to date"
          elif [ -n "$added" ]; then
            git commit -m "chore: add contributor(s) $(echo "$added" | tr '\n' ' ') [skip ci]"
            git push
          else
            git commit -m "chore: sync CONTRIBUTORS.md with GitHub contributor list [skip ci]"
            git push
          fi
